[project]
name = "spght"
version = "0.0.1"
dynamic = ["authors"]
description = "Sparse Grid Hierarchical Tensors"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSES/*.txt"]
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["bitarray", "numpy"]

[project.optional-dependencies]
# bridge to the classical filter-bank machinery, see spght.pywt_compat
pywt = ["PyWavelets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spght"]

[tool.mypy]
exclude = ["^example/"]

[[tool.mypy.overrides]]
module = "pywt.*"
ignore_missing_imports = true

[tool.ruff]
# ignore "Import block is un-sorted or un-formatted"
lint.ignore = ["I001"]