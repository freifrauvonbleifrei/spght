[project]
name = "spght"
version = "0.0.1"
dynamic = ["authors"]
description = "Sparse Grid Hierarchical Tensors"
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = ["bitarray","numpy", "PyWavelets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spght"]

[[tool.mypy.overrides]]
module = "pywt.*"
ignore_missing_imports = true
